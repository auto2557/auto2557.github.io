<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สุ่มคำคม 12 ราศี</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>สุ่มคำคม 12 ราศี</h1>
        <select id="zodiacSelect">
            <option value="">เลือก 12 ราศี</option>
            <option value="aries">เมษ (21 มี.ค. - 19 เม.ย.)</option>
            <option value="taurus">พฤษภ (20 เม.ย. - 20 พ.ค.)</option>
            <option value="gemini">เมถุน (21 พ.ค. - 20 มิ.ย.)</option>
            <option value="cancer">กรกฎ (21 มิ.ย. - 22 ก.ค.)</option>
            <option value="leo">สิงห์ (23 ก.ค. - 22 ส.ค.)</option>
            <option value="virgo">กันย์ (23 ส.ค. - 22 ก.ย.)</option>
            <option value="libra">ตุลย์ (23 ก.ย. - 22 ต.ค.)</option>
            <option value="scorpio">พิจิก (23 ต.ค. - 21 พ.ย.)</option>
            <option value="sagittarius">ธนู (22 พ.ย. - 21 ธ.ค.)</option>
            <option value="capricorn">มังกร (22 ธ.ค. - 19 ม.ค.)</option>
            <option value="aquarius">กุมภ์ (20 ม.ค. - 18 ก.พ.)</option>
            <option value="pisces">มีน (19 ก.พ. - 20 มี.ค.)</option>
        </select>
        <button id="randomQuoteBtn">สุ่มคำคม</button>
        <p id="quoteDisplay" class="fade-in"></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
